name: Legacy GitHub Pages deploy (manual, static-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-static:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retirement status
        run: |
          echo "This repository now deploys web via Vercel dynamic runtime from apps/web."
          echo "GitHub Pages static deployment is retained as a manual legacy workflow only."
          echo "If static export is needed again, restore output:'export' and /out artifact flow."
